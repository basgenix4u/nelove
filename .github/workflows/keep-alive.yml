# Keep-alive for the free-tier Render deployment.
#
# Render's free web services sleep after 15 minutes without traffic. This
# workflow pings the health endpoint every 5 minutes so the nelove storefront
# stays awake 24/7 — free (GitHub Actions scheduled runs are free on public
# repos), and 24/7 uptime fits within Render's 750 free instance-hours/month.
name: Keep nelove awake

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (Render sleeps after 15 idle)
  workflow_dispatch: # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the health endpoint
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 60 \
            https://nelove.onrender.com/api/health
          echo "nelove is awake."
